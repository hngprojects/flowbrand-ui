# Flowbrand UI Nginx reverse proxy.
#
# Assumptions:
# - Backend API is already running on port 3000.
# - Production frontend runs on port 3001.
# - Staging frontend runs on port 3002.
#
# Install:
#   sudo cp deploy/nginx/flowbrand-ui.conf /etc/nginx/sites-available/flowbrand-ui.conf
#   sudo ln -s /etc/nginx/sites-available/flowbrand-ui.conf /etc/nginx/sites-enabled/flowbrand-ui.conf
#   sudo nginx -t
#   sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

upstream flowbrand_ui_prod {
    server 127.0.0.1:3001;
}

upstream flowbrand_ui_staging {
    server 127.0.0.1:3002;
}

server {
    listen 80;
    listen [::]:80;
    server_name flowbrand.hng14.com;

    location / {
        proxy_pass http://flowbrand_ui_prod;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.flowbrand.hng14.com;

    location / {
        proxy_pass http://flowbrand_ui_staging;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }
}
